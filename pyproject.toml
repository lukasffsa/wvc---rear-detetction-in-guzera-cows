[project]
name = "fitcow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cycler==0.12.1",
    "filelock==3.32.3",
    "fonttools==4.63.0",
    "fsspec==2026.7.0",
    "jinja2==3.1.6",
    "kiwisolver==1.5.0",
    "markupsafe==3.0.3",
    "matplotlib==3.11.1",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "numpy==2.5.2",
    "opencv-python==5.0.0.93",
    "packaging==26.3",
    "pillow==12.3.0",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "setuptools==78.1.0",
    "six==1.17.0",
    "sympy==1.14.0",
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "typing-extensions==4.16.0",
]

[project.scripts]
fasterrcnn = "fasterrcnn:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }